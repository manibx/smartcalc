<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SmartCalc - Free Online Calculators</title>
<meta name="description" content="SmartCalc offers free, fast and easy online calculators including Percentage, BMI, Age, Discount, GST, Interest and EMI calculators.">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#222;
}

header{
  background:#2563eb;
  color:white;
  text-align:center;
  padding:30px 15px;
}

header h1{
  margin:0;
  font-size:38px;
}

header p{
  margin:8px 0 0;
  font-size:17px;
}

.search{
  max-width:600px;
  margin:25px auto;
  padding:0 15px;
}

.search input{
  width:100%;
  padding:15px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:20px;
}

.card{
  background:white;
  padding:22px;
  border-radius:14px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.card h2{
  margin-top:0;
  color:#2563eb;
  font-size:21px;
}

.card input{
  width:100%;
  padding:12px;
  margin:7px 0;
  border:1px solid #ddd;
  border-radius:8px;
  font-size:15px;
}

.card button{
  width:100%;
  padding:12px;
  margin-top:8px;
  border:0;
  border-radius:8px;
  background:#2563eb;
  color:white;
  font-size:16px;
  cursor:pointer;
}

.card button:hover{
  opacity:.9;
}

.result{
  margin-top:12px;
  font-weight:bold;
  color:#111;
  min-height:22px;
}

.about{
  background:white;
  margin-top:30px;
  padding:25px;
  border-radius:14px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

footer{
  text-align:center;
  padding:30px 15px;
  margin-top:30px;
  background:#111827;
  color:white;
}

footer a{
  color:white;
  margin:0 7px;
  text-decoration:none;
}

.hidden{
  display:none;
}

@media(max-width:600px){
  header h1{
    font-size:30px;
  }
}
</style>
</head>

<body>

<header>
  <h1>SmartCalc</h1>
  <p>Free, Fast & Easy Online Calculators</p>
</header>

<div class="search">
  <input type="text" id="searchBox"
  placeholder="Search calculator..."
  onkeyup="searchCalculator()">
</div>

<div class="container">

<div class="cards">

<!-- Percentage -->
<div class="card">
<h2>Percentage Calculator</h2>
<input type="number" id="percentNumber" placeholder="Enter number">
<input type="number" id="percentValue" placeholder="Enter percentage">
<button onclick="percent()">Calculate</button>
<p class="result" id="percentResult"></p>
</div>

<!-- BMI -->
<div class="card">
<h2>BMI Calculator</h2>
<input type="number" id="bmiWeight" placeholder="Weight (kg)">
<input type="number" id="bmiHeight" placeholder="Height (cm)">
<button onclick="bmi()">Calculate BMI</button>
<p class="result" id="bmiResult"></p>
</div>

<!-- Age -->
<div class="card">
<h2>Age Calculator</h2>
<input type="date" id="birthDate">
<button onclick="age()">Calculate Age</button>
<p class="result" id="ageResult"></p>
</div>

<!-- Test Score -->
<div class="card">
<h2>Test Score Calculator</h2>
<input type="number" id="obtained" placeholder="Obtained Marks">
<input type="number" id="total" placeholder="Total Marks">
<button onclick="score()">Calculate Score</button>
<p class="result" id="scoreResult"></p>
</div>

<!-- Discount -->
<div class="card">
<h2>Discount Calculator</h2>
<input type="number" id="price" placeholder="Original Price">
<input type="number" id="discountRate" placeholder="Discount (%)">
<button onclick="discount()">Calculate Discount</button>
<p class="result" id="discountResult"></p>
</div>

<!-- GST -->
<div class="card">
<h2>GST Calculator</h2>
<input type="number" id="gstPrice" placeholder="Amount">
<input type="number" id="gstRate" placeholder="GST (%)">
<button onclick="gst()">Calculate GST</button>
<p class="result" id="gstResult"></p>
</div>

<div class="card">
<h2>Simple Interest Calculator</h2>
<input type="number" id="principal" placeholder="Principal Amount">
